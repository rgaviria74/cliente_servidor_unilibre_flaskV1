<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1173d4",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px"
            },
          },
        },
      };
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="flex min-h-screen w-full flex-col">
<header class="sticky top-0 z-10 flex items-center justify-between border-b border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark px-4 sm:px-6 lg:px-8 py-3">
<div class="flex items-center gap-3">
<div class="w-8 h-8 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z" fill="currentColor"></path>
</svg>
</div>
<h1 class="text-xl font-bold text-gray-900 dark:text-white">Student Manager</h1>
</div>
<div class="flex items-center gap-4">
<nav class="hidden md:flex items-center gap-6">
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary" href="#">Home</a>
<a class="text-sm font-medium text-primary dark:text-primary" href="#">Students</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary" href="#">Courses</a>
</nav>
<button class="relative rounded-full p-2 text-gray-600 dark:text-gray-300 hover:bg-primary/10 dark:hover:bg-primary/20">
<span class="material-symbols-outlined"> notifications </span>
</button>
<div class="w-10 h-10 rounded-full bg-cover bg-center" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCuNTUcIUhZdzCdmlw84E1i42VZyAv54KEGevDd-WZFRFPovSzIAu00PRlM84icfzYZjWisc7kgpN1WpZfKnHa1PdULccZYDN2qdYppuuBF3AJSvJBF2B-ybP8zuxPlM83ZMQ8TD0D57z9Kul64JEhcJjbK95RoyKEqLv4Oe1ze3jPWOvS1bXlkisCBkPAmZU4RHf7ExXA5odPfXmO7viaFIe3TyAd20OZTVdBrTEwfKSe0FGcrouqCc58MUxB_K4cNqAoV3cZO_Q");'></div>
</div>
</header>
<main class="flex-1 px-4 sm:px-6 lg:px-8 py-8">
<div class="mx-auto max-w-7xl">
<div class="mb-6" id="notification-area">
<div class="flex items-center p-4 rounded-lg bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-200 hidden" id="notificacion-exito">
<span class="material-symbols-outlined mr-3">check_circle</span>
<p>Student added successfully.</p>
</div>
<div class="flex items-center p-4 rounded-lg bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-200 hidden" id="notificacion-error">
<span class="material-symbols-outlined mr-3">error</span>
<p>Failed to add student. Please try again.</p>
</div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
<div class="lg:col-span-1 bg-background-light dark:bg-background-dark p-6 rounded-lg border border-gray-200 dark:border-gray-700">

<!-- Formulario para crear/actualizar -->
<h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white" id="form-title">Create New Student</h2>
<form class="space-y-6" id="estudiante-form">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="name">Id</label>
<input class="form-input w-full rounded border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 focus:ring-primary focus:border-primary text-gray-900 dark:text-white" id="estudiante-id" min="1" placeholder="Enter student id" required step="1" type="number"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="name">Name</label>
<input class="form-input w-full rounded border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 focus:ring-primary focus:border-primary text-gray-900 dark:text-white" id="nombre" placeholder="Enter student name" required type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="name">Last Name</label>
<input class="form-input w-full rounded border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 focus:ring-primary focus:border-primary text-gray-900 dark:text-white" id="apellido" placeholder="Enter student last name" required type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="age">Age</label>
<input class="form-input w-full rounded border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 focus:ring-primary focus:border-primary text-gray-900 dark:text-white" id="edad" max="100" min="15" placeholder="Enter student age" required type="number"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="major">Major</label>
<input class="form-input w-full rounded border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 focus:ring-primary focus:border-primary text-gray-900 dark:text-white" id="carrera" placeholder="Enter student major" required type="text"/>
</div>
<button class="w-full flex justify-center items-center gap-2 rounded bg-primary py-2 px-4 text-sm font-semibold text-white shadow-sm hover:bg-primary/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" type="submit" id="submit-btn">
<span class="material-symbols-outlined">add</span>
                  Add Student
</button>
<button class="w-full flex justify-center items-center gap-2 rounded bg-primary py-2 px-4 text-sm font-semibold text-white shadow-sm hover:bg-primary/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" style="display: none;" type="button" id="cancel-btn">
<span class="material-symbols-outlined">cancel</span>
                  Cancel
</button>
</form>
</div>

<!-- Tabla de estudiantes -->
<div class="lg:col-span-2">
<div class="flex flex-col sm:flex-row justify-between items-center mb-6">
<h2 class="text-2xl font-bold text-gray-900 dark:text-white">Student List</h2>
<div class="relative mt-4 sm:mt-0">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
<input class="form-input w-full sm:w-64 rounded-lg border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 pl-10 focus:ring-primary focus:border-primary text-gray-900 dark:text-white" id="search" placeholder="Search by name or major" type="text"/>
</div>
</div>
<div class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">
<table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700" id="estudiantes-table">
<thead class="bg-gray-50 dark:bg-gray-800">
<tr>
<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider" scope="col">ID</th>
<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider" scope="col">Name</th>
<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider" scope="col">Last Name</th>
<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider" scope="col">Age</th>
<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider" scope="col">Major</th>
<th class="px-6 py-3 text-center text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider" scope="col">Actions</th>
</tr>
</thead>
<tbody class="bg-background-light dark:bg-background-dark divide-y divide-gray-200 dark:divide-gray-700" id="estudiantes-tbody">
<!-- Se llenará dinámicamente -->
</tbody>
</table>
</div>
<div class="flex items-center justify-between border-t border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark px-4 py-3 sm:px-6 rounded-b-lg">

<div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">


</div>
</div>
</div>
</div>
</div>
</main>
</div>
<script src="js/app.js"></script>
</body></html>
